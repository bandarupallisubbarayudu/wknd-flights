<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html" />
<sly data-sly-use.teaser="com.adobe.aem.wknd.flights.core.models.TeaserModel" />

<div class="cmp-teaser" id="${teaser.anchorId}" data-sly-test="${teaser.title}">
    <div class="cmp-teaser__wrapper">
        <div class="cmp-teaser__image-container" data-sly-test="${teaser.image}">
            <img class="cmp-teaser__image" src="${teaser.image}" alt="${teaser.altText}" loading="lazy" />
        </div>
        <div class="cmp-teaser__content">
            <div class="cmp-teaser__heading-container">
                <h2 data-sly-element="${teaser.headingLevel}" class="cmp-teaser__title">${teaser.title}</h2>
                <p class="cmp-teaser__intro" data-sly-test="${teaser.introText}">${teaser.introText}</p>
            </div>
            <div class="cmp-teaser__description" data-sly-test="${teaser.description}">
                ${teaser.description @ context='html'}
            </div>
            <div class="cmp-teaser__link-container" data-sly-test="${teaser.links}">
                <ul class="cmp-teaser__link-list" data-sly-list.link="${teaser.links}">
                    <li class="cmp-teaser__link-item" data-sly-test="${link.linkURL && link.linkText}">
                        <a class="cmp-teaser__link" href="${link.linkURL}" target="${teaser.target}" rel="${teaser.rel}">
                            ${link.linkText}
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="cmp-teaser__back-to-top" data-sly-test="${teaser.showBackToTop}">
        <a class="cmp-teaser__back-to-top-link" href="#"> Back to top </a>
    </div>
</div>

<div data-sly-test="${!teaser.title}" data-emptytext="Teaser Component" class="cq-placeholder"></div>
